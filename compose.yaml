services:
  minecraft:
    image: itzg/minecraft-server:java25
    container_name: minecraft
    restart: unless-stopped
    depends_on:
      repo-sync:
        condition: service_completed_successfully

    ports:
      - "25565:25565/tcp"   # Java
      - "19132:19132/tcp"   # Bedrock Signaling
      - "19132:19132/udp"   # Bedrock Gameplay
      - "8100:8100/tcp"     # BlueMap-Webkarte
      - "24454:24454/udp"   # Simple Voice Chat

    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "26.3"

      TZ: "Europe/Berlin"

      INIT_MEMORY: "512M"
      MAX_MEMORY: "6G"

      VIEW_DISTANCE: "5"
      SIMULATION_DISTANCE: "4"
      MAX_PLAYERS: "20"

      PAUSE_WHEN_EMPTY_SECONDS: "-1"

      ONLINE_MODE: "TRUE"
      ENABLE_WHITELIST: "TRUE"
      ENFORCE_WHITELIST: "TRUE"
      EXISTING_WHITELIST_FILE: "MERGE"
      WHITELIST: "MC_Black_Death,${EXTRA_PLAYERS}"

      ENABLE_RCON: "TRUE"
      RCON_PASSWORD_FILE: /run/secrets/rcon_password

      COPY_CONFIG_DEST: /data
      SYNC_SKIP_NEWER_IN_DESTINATION: "false"

      SPAWN_PROTECTION: "50"

      MODRINTH_PROJECTS: |
        chunky
        worldaccessblocker
        core-teams
        grimac
        bluemap
        simple-voice-chat

      # EssentialsX ist auf 2.22.0 fixiert; Unterstützung für Paper 26.3 ist unbestätigt.
      PLUGINS: |
        https://github.com/EssentialsX/Essentials/releases/download/2.22.0/EssentialsX-2.22.0.jar
        https://raw.githubusercontent.com/EvModder/DropHeads/master/DropHeads_v3.10.11.jar
        https://download.geysermc.org/v2/projects/geyser/versions/latest/builds/latest/downloads/spigot
        https://download.geysermc.org/v2/projects/floodgate/versions/latest/builds/latest/downloads/spigot

      RCON_CMDS_STARTUP: |-
        gamerule players_sleeping_percentage 50
        scoreboard objectives setdisplay sidebar hh_hunter
        scoreboard objectives add deaths deathCount
        scoreboard objectives setdisplay list deaths

      RCON_CMDS_ON_CONNECT: |-
        scoreboard players add @a deaths 0

    volumes:
      - /home/piadmin/minecraft/data:/data
      - /opt/minecraft-server/config:/config:ro

    secrets:
      - rcon_password

    stop_grace_period: 120s

  border-scheduler:
    image: itzg/rcon-cli:1.7.7-ubuntu
    restart: unless-stopped

    depends_on:
      - minecraft

    environment:
      START_AT: "2026-11-02T00:00:00+01:00"
      RELEASE_AT: "2026-11-05T00:00:00+01:00"

      BORDER_X: "0"
      BORDER_Z: "0"

    secrets:
      - rcon_password

    entrypoint: ["/bin/sh", "-ec"]

    command:
      - |-
        rcon() {
          RCON_PASSWORD="$$(cat /run/secrets/rcon_password)" \
            rcon-cli --host minecraft --port 25575 "$$@"
        }

        start=$$(date -d "$$START_AT" +%s)
        release=$$(date -d "$$RELEASE_AT" +%s)
        last=""

        while true; do
          now=$$(date +%s)

          if [ "$$now" -lt "$$start" ]; then
            size=20000
          elif [ "$$now" -lt "$$release" ]; then
            size=6000
          else
            size=20000
          fi

          if rcon list >/dev/null 2>&1; then
            if [ "$$last" != "$$size" ]; then
              if rcon "execute in minecraft:overworld run worldborder center $$BORDER_X $$BORDER_Z" &&
                 rcon "execute in minecraft:overworld run worldborder set $$size"; then
                echo "Worldborder set: $$size"
                last="$$size"
              fi
            fi
          else
            last=""
          fi

          sleep 30
        done

  repo-sync:
    image: alpine/git:latest
    user: "0:0"
    restart: "no"

    environment:
      REPO_URL: "https://github.com/Zweikaufswagen/Minecraft-Server-Portainer-Deployment.git"
      REPO_BRANCH: "main"
      GIT_TERMINAL_PROMPT: "0"

    volumes:
      - /opt/minecraft-server/config:/target-config
      - /home/piadmin/minecraft/data:/target-data

    entrypoint: ["/bin/sh", "-ec"]

    command:
      - |-
        apk add --no-cache yq-go

        work=$$(mktemp -d)
        tmp=""
        trap 'rm -rf "$$work"; if [ -n "$$tmp" ]; then rm -f "$$tmp"; fi' EXIT

        git clone --depth 1 \
          --branch "$$REPO_BRANCH" \
          "$$REPO_URL" \
          "$$work/repo"

        override="$$work/repo/data/plugins/Geyser-Spigot/config.yml"
        target="/target-data/plugins/Geyser-Spigot/config.yml"

        # Quellen prüfen, bevor Dateien verändert werden.
        test -d "$$work/repo/config"
        test -s "$$override"
        yq eval -e 'tag == "!!map"' "$$override" >/dev/null

        # Die Konfigurationsversion verwaltet Geyser selbst.
        if yq eval -e 'has("config-version")' "$$override" >/dev/null; then
          echo "FEHLER: config-version aus der Override-Datei entfernen." >&2
          exit 1
        fi

        # Bisherige Synchronisierung beibehalten.
        cp -a "$$work/repo/config/." /target-config/

        mkdir -p /target-data/plugins/Geyser-Spigot
        tmp=$$(mktemp /target-data/plugins/Geyser-Spigot/.config.yml.XXXXXX)

        if [ -f "$$target" ]; then
          # Vorhandene Werte erhalten; Repo-Werte haben Vorrang.
          yq eval -e 'tag == "!!map"' "$$target" >/dev/null

          yq eval-all \
            'select(fileIndex == 0) * select(fileIndex == 1)' \
            "$$target" "$$override" > "$$tmp"
        else
          # Erster Start: Geyser ergänzt die übrigen Standardwerte.
          cp "$$override" "$$tmp"
        fi

        # Ergebnis prüfen.
        yq eval -e 'tag == "!!map"' "$$tmp" >/dev/null

        # Eine Sicherung des Standes vor diesem Lauf behalten.
        if [ -f "$$target" ]; then
          cp -p "$$target" "$$target.before-repo-sync"
        fi

        # Rechte passend zu deinem Minecraft-Nutzer setzen.
        chown 1000:1000 \
          /target-data/plugins \
          /target-data/plugins/Geyser-Spigot \
          "$$tmp"
        chmod 0644 "$$tmp"

        # Erst die fertig erzeugte Datei einsetzen.
        mv -f "$$tmp" "$$target"
        tmp=""

        echo "Geyser-Konfiguration erfolgreich zusammengeführt."

secrets:
  rcon_password:
    file: /opt/minecraft-server/secrets/rcon_password
