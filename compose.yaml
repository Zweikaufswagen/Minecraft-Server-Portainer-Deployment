x-deploy-revision: &deploy-revision "1"
services:
  minecraft:
    image: itzg/minecraft-server:java25
    container_name: minecraft
    restart: unless-stopped
    depends_on:
      repo-sync:
        condition: service_completed_successfully

    ports:
      - "25565:25565/tcp"

    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "26.3"

      TZ: "Europe/Berlin"

      INIT_MEMORY: "512M"
      MAX_MEMORY: "5G"

      VIEW_DISTANCE: "5"
      SIMULATION_DISTANCE: "4"
      MAX_PLAYERS: "20"

      PAUSE_WHEN_EMPTY_SECONDS: "-1"

      ONLINE_MODE: "TRUE"
      ENABLE_WHITELIST: "TRUE"
      ENFORCE_WHITELIST: "TRUE"
      EXISTING_WHITELIST_FILE: "SYNCHRONIZE"
      WHITELIST: "MC_Black_Death,${EXTRA_PLAYERS}"

      ENABLE_RCON: "TRUE"
      RCON_PASSWORD_FILE: /run/secrets/rcon_password
      
      DEPLOY_REVISION: *deploy-revision
      COPY_CONFIG_DEST: /data
      SYNC_SKIP_NEWER_IN_DESTINATION: "false"

      SPAWN_PROTECTION: "50"

      MODRINTH_PROJECTS: |
        chunky
        worldaccessblocker
        core-teams

      PLUGINS: |
        https://raw.githubusercontent.com/EvModder/DropHeads/master/DropHeads_v3.10.11.jar

      RCON_CMDS_STARTUP: |-
        gamerule players_sleeping_percentage 50

    volumes:
      - /home/piadmin/minecraft/data:/data
      - /opt/minecraft-server/config:/config:ro
      - /opt/minecraft-server/plugins:/plugins:ro

    secrets:
      - rcon_password

    stop_grace_period: 120s

  border-scheduler:
    image: itzg/rcon-cli:1.7.7-ubuntu
    restart: unless-stopped

    depends_on:
      - minecraft

    environment:
      START_AT: "2026-11-02T00:00:00+01:00"
      RELEASE_AT: "2026-11-05T00:00:00+01:00"

      BORDER_X: "0"
      BORDER_Z: "0"

    secrets:
      - rcon_password

    entrypoint: ["/bin/sh", "-ec"]

    command:
      - |-
        rcon() {
          RCON_PASSWORD="$$(cat /run/secrets/rcon_password)" \
            rcon-cli --host minecraft --port 25575 "$$@"
        }

        start=$$(date -d "$$START_AT" +%s)
        release=$$(date -d "$$RELEASE_AT" +%s)
        last=""

        while true; do
          now=$$(date +%s)

          if [ "$$now" -lt "$$start" ]; then
            size=20000
          elif [ "$$now" -lt "$$release" ]; then
            size=6000
          else
            size=20000
          fi

          if rcon list >/dev/null 2>&1; then
            if [ "$$last" != "$$size" ]; then
              if rcon "execute in minecraft:overworld run worldborder center $$BORDER_X $$BORDER_Z" &&
                 rcon "execute in minecraft:overworld run worldborder set $$size"; then
                echo "Worldborder set: $$size"
                last="$$size"
              fi
            fi
          else
            last=""
          fi

          sleep 30
        done

  repo-sync:
    image: alpine/git:latest
    restart: "no"

    environment:
      REPO_URL: "https://github.com/Zweikaufswagen/Minecraft-Server-Portainer-Deployment.git"
      REPO_BRANCH: "main"
      DEPLOY_REVISION: *deploy-revision
      GIT_TERMINAL_PROMPT: "0"

    volumes:
      - /opt/minecraft-server/config:/target-config
      - /opt/minecraft-server/plugins:/target-plugins

    entrypoint: ["/bin/sh", "-ec"]

    command:
      - |-
        work=$$(mktemp -d)
        trap 'rm -rf "$$work"' EXIT

        git clone --depth 1 \
          --branch "$$REPO_BRANCH" \
          "$$REPO_URL" \
          "$$work/repo"

        test -d "$$work/repo/config"
        test -d "$$work/repo/plugins"

        cp -a "$$work/repo/config/." /target-config/
        cp -a "$$work/repo/plugins/." /target-plugins/

secrets:
  rcon_password:
    file: /opt/minecraft-server/secrets/rcon_password
