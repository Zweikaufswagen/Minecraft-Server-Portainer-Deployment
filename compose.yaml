
services:
  minecraft:
    image: itzg/minecraft-server:java25
    container_name: minecraft
    restart: unless-stopped

    ports:
      - "25565:25565/tcp"

    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "26.3"

      TZ: "Europe/Berlin"

      INIT_MEMORY: "512M"
      MAX_MEMORY: "5G"

      VIEW_DISTANCE: "5"
      SIMULATION_DISTANCE: "4"
      MAX_PLAYERS: "20"

      ONLINE_MODE: "TRUE"
      ENABLE_WHITELIST: "TRUE"
      ENFORCE_WHITELIST: "TRUE"
      EXISTING_WHITELIST_FILE: "SYNCHRONIZE"
      WHITELIST: "MC_Black_Death"

      ENABLE_RCON: "TRUE"

    volumes:
      - /home/piadmin/minecraft/data:/data

    stop_grace_period: 120s
