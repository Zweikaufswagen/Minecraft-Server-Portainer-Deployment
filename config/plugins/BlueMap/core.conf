# BlueMap benötigt Minecraft-Client-Ressourcen von Mojang für Modelle und Texturen.
# true bestätigt Mojangs EULA, eine Java-Edition-Lizenz und den Ressourcen-Download.
# https://bluemap.bluecolored.de/wiki/configs/Core.html
accept-download: true

# Raspberry Pi 4: nur einen Render-Thread verwenden.
render-thread-count: 1
update-cooldown: 60
full-update-interval: 1440
region-file-check-interval: 5