# UDP-Port muss zum Compose-Portmapping passen.
port=24454
# Im Container auf allen Netzwerkadressen lauschen.
bind_address=*
# Leer: keine feste externe Adresse fuer LAN/Tailscale/Internet erzwingen.
# Bei einem separaten UDP-Tunnel dessen Host und Port eintragen.
voice_host=

max_voice_distance=48.0
whisper_distance=24.0
enable_groups=true
# Vanilla- und Geyser-Spieler sollen weiterhin beitreten koennen.
force_voice_chat=false
