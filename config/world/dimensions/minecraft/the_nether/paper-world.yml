# This is a world configuration file for Paper.
# This file may start empty but can be filled with settings to override ones in the config/paper-world-defaults.yml
#
# For more information, see https://docs.papermc.io/paper/reference/configuration/#per-world-configuration
#
# World: minecraft:the_nether

_version: 31
anticheat:
  anti-xray:
    enabled: true
    engine-mode: 3
    hidden-blocks:
      - ancient_debris
      - nether_gold_ore
      - nether_quartz_ore
      - glowstone
      - magma_block
      - bone_block
      - nether_bricks
      - polished_blackstone_bricks

    replacement-blocks:
      - netherrack
      - basalt
      - blackstone
      - gravel
      - soul_sand
      - soul_soil

    max-block-height: 128
    update-radius: 2
    lava-obscures: false
    use-permission: false